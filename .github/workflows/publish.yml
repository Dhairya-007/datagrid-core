name: Publish

# Tag a release and this publishes it, so the version on npm is always a
# commit in the history rather than whatever happened to be on a laptop.
#
# Needs an NPM_TOKEN secret with publish rights on the package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run verify

      # Skipped rather than failed when no token is configured, so tagging a
      # release never paints the repository red for a missing secret.
      - name: Check for a publish token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No NPM_TOKEN secret, so this tag was verified but not published."
          fi

      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
